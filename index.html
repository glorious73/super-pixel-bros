<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Super Pixel Bros</title>
  <meta name="description" content="Super Pixel Bros — a retro 2D platformer. Run, jump and save the Pixel Kingdom. Day or night, English or العربية." />
  <meta name="theme-color" content="#0a0a12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PixelBros" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="272"></canvas>
    <div id="touch">
      <button id="btnL" class="tbtn" tabindex="-1" aria-label="left">&#9664;</button>
      <button id="btnR" class="tbtn" tabindex="-1" aria-label="right">&#9654;</button>
      <button id="btnJump" class="tbtn" tabindex="-1" aria-label="jump">A</button>
      <button id="btnPause" class="tbtn small" tabindex="-1" aria-label="pause">II</button>
      <button id="btnTitle" class="tbtn small" tabindex="-1" aria-label="title">Q</button>
    </div>
    <div id="rotate">ROTATE TO LANDSCAPE</div>
  </div>
  <footer id="footer">SUPER PIXEL BROS</footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
